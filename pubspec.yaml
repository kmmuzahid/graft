name: graft
description: A high-performance, fine-grained reactive state management library for Flutter with automatic slot-level rebuild diffing, route-stack inheritance, and zero code-gen.
version: 0.1.0-alpha.1
homepage: https://github.com/kmmuzahid/graft
repository: https://github.com/kmmuzahid/graft
issue_tracker: https://github.com/kmmuzahid/graft/issues

topics:
  - state-management
  - reactivity
  - performance
  - dependency-injection
  - widgets

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^3.0.0

