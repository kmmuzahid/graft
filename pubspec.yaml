name: graft
description: >-
  Self-optimizing state management engine for Flutter: clean domain architecture
  of BLoC, micro-rebuild precision of Signals, and register-level diffing speed
  of a hardware bitmask.
version: 0.1.2-alpha.4
homepage: https://github.com/kmmuzahid/graft
repository: https://github.com/kmmuzahid/graft
issue_tracker: https://github.com/kmmuzahid/graft/issues

topics:
  - state-management
  - reactivity
  - performance
  - dependency-injection
  - widgets

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_bloc: ^8.1.6
  flutter_riverpod: ^2.5.1
  signals_flutter: ^5.5.0
  get: ^4.6.6

