name: graft
description: >-
  Self-optimizing state management engine for Flutter: BLoC-style domain models,
  Signals-level micro-rebuild precision, and register-level CPU bitmask diffing.
version: 1.0.0-alpha.5
homepage: https://github.com/kmmuzahid/graft
repository: https://github.com/kmmuzahid/graft
issue_tracker: https://github.com/kmmuzahid/graft/issues

topics:
  - state-management
  - reactivity
  - performance
  - dependency-injection
  - widgets

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_bloc: ^8.1.6
  flutter_riverpod: ^2.5.1
  signals_flutter: ^5.5.0
  get: ^4.6.6
  provider: ^6.1.5+1
  sqlite3: ^3.7.1

